services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mb
      POSTGRES_PASSWORD: mb
      POSTGRES_DB: mb_wallet_bridge
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mb -d mb_wallet_bridge"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  db-data:
